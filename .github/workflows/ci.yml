name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # sccache + cargo incremental conflict; disable incremental in CI.
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Clippy runs per OS: each one compiles its own cfg branches
  # (REQ-XPLAT-011.A1).
  fmt-lint:
    name: fmt + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not -latest: windows-latest is VS 2026, whose STL drops
        # stdext::checked_array_iterator, which the bundled DuckDB (libduckdb-sys
        # 1.10502) still uses. Newer DuckDB builds there but needs Rust 1.88.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # .cargo/config.toml links Linux targets with clang + mold.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.6
      # An unreachable cache must not fail the build: fall back to plain
      # rustc (an empty RUSTC_WRAPPER turns the wrapper off; REQ-XPLAT-011.A1).
      - name: build without sccache if its server cannot start
        shell: bash
        run: sccache --start-server || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.6
      # An unreachable cache must not fail the build: fall back to plain
      # rustc (an empty RUSTC_WRAPPER turns the wrapper off; REQ-XPLAT-011.A1).
      - name: build without sccache if its server cannot start
        shell: bash
        run: sccache --start-server || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Fast tier — unit + in-process integration. No release binary build.
      - name: fast tier
        run: cargo nextest run --lib --test lib_integration
      # CLI tier — needs the release binary.
      - name: release build
        run: cargo build --release
      - name: cli tier
        run: cargo nextest run --test agentic

  # The desktop GUI's regression suite (gui/): every screen's flows, the
  # engine contract, pixel match against the design snapshot, axe and
  # keyboard tests, and the Tauri crate. Same stages as
  # `scripts/regression.sh gui`. The pixel baselines are rendered on the
  # runner from specs/disk-cleanup/snapshot.html, so this job stays on
  # macOS; `gui-build` below builds the app on Linux and Windows.
  gui:
    name: gui regression (macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: mozilla-actions/sccache-action@v0.0.6
      # An unreachable cache must not fail the build: fall back to plain
      # rustc (an empty RUSTC_WRAPPER turns the wrapper off; REQ-XPLAT-011.A1).
      - name: build without sccache if its server cannot start
        shell: bash
        run: sccache --start-server || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - run: npm ci
      - name: unit + flow tests (vitest)
        run: npm test
      - name: lints (tokens, boundary, controls)
        run: npm run lint:tokens
      - name: types (tsc)
        run: npx tsc --noEmit -p .
      - name: install Playwright browser
        run: npx playwright install chromium
      - name: visual + a11y + keyboard (playwright)
        run: npx playwright test
      - name: tauri fmt
        working-directory: gui/src-tauri
        run: cargo fmt --check
      - name: tauri clippy
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: tauri tests
        working-directory: gui/src-tauri
        run: cargo test

  # The Tauri app on Linux and Windows (REQ-XPLAT-011.A2): the crate's
  # clippy and tests, then a release bundle (.deb + AppImage, NSIS).
  gui-build:
    name: gui build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        name: webkit2gtk and friends
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf libfuse2
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: mozilla-actions/sccache-action@v0.0.6
      # An unreachable cache must not fail the build: fall back to plain
      # rustc (an empty RUSTC_WRAPPER turns the wrapper off; REQ-XPLAT-011.A1).
      - name: build without sccache if its server cannot start
        shell: bash
        run: sccache --start-server || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - run: npm ci
      - name: unit + flow tests (vitest)
        run: npm test
      - name: frontend build
        run: npm run build
      - name: tauri clippy
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: tauri tests
        working-directory: gui/src-tauri
        run: cargo test
      - name: bundle
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: disky-gui-${{ runner.os }}
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
