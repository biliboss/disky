name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # sccache + cargo incremental conflict; disable incremental in CI.
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fmt-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.6
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Fast tier — unit + in-process integration. No release binary build.
      - name: fast tier
        run: cargo nextest run --lib --test lib_integration
      # CLI tier — needs the release binary.
      - name: release build
        run: cargo build --release
      - name: cli tier
        run: cargo nextest run --test agentic

  # The desktop GUI's regression suite (gui/): every screen's flows, the
  # engine contract, pixel match against the design snapshot, axe and
  # keyboard tests, and the Tauri crate. Same stages as
  # `scripts/regression.sh gui`. macOS only: the app is macOS-only and the
  # visual baselines are rendered on the runner from specs/disk-cleanup/
  # snapshot.html, in the same browser as the app.
  gui:
    name: gui regression (macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: mozilla-actions/sccache-action@v0.0.6
      - run: npm ci
      - name: unit + flow tests (vitest)
        run: npm test
      - name: lints (tokens, boundary, controls)
        run: npm run lint:tokens
      - name: types (tsc)
        run: npx tsc --noEmit -p .
      - name: install Playwright browser
        run: npx playwright install chromium
      - name: visual + a11y + keyboard (playwright)
        run: npx playwright test
      - name: tauri fmt
        working-directory: gui/src-tauri
        run: cargo fmt --check
      - name: tauri clippy
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: tauri tests
        working-directory: gui/src-tauri
        run: cargo test
